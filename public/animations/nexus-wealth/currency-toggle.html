<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Currency Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f9fafb;
    --border:#e5e7eb;
    --text-primary:#111827;
    --text-secondary:#4b5563;
    --accent:#064e3b;
    --font-serif:'Cormorant Garamond', Georgia, serif;
    --font-sans:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--bg-alt);
    padding:48px 20px;
    display:flex;
    justify-content:center;
  }

  .panel{
    width:440px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:2rem;
  }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:1.6rem;
  }
  .section-title{
    font-size:0.8rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--text-secondary);
    margin-bottom:2px;
  }
  .chart-title{
    font-family:var(--font-serif);
    font-size:1.15rem;
    font-weight:600;
    color:var(--text-primary);
  }

  /* --- 3-way currency toggle --- */
  .currency-toggle{
    position:relative;
    display:flex;
    border:1px solid var(--border);
  }
  .currency-btn{
    position:relative;
    z-index:2;
    width:38px;
    padding:0.45rem 0;
    text-align:center;
    font-family:var(--font-mono);
    font-size:0.85rem;
    font-weight:600;
    color:var(--text-secondary);
    background:transparent;
    border:none;
    transition:color .35s ease;
  }
  .currency-btn.active{ color:#ffffff; }
  .currency-indicator{
    position:absolute;
    top:0; left:0;
    width:33.333%; height:100%;
    background:var(--accent);
    z-index:1;
    transition:transform .45s cubic-bezier(.65,0,.35,1);
  }

  /* --- Metric rows --- */
  .metric-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:0.85rem 0;
    border-bottom:1px solid var(--border);
  }
  .metric-row:last-child{ border-bottom:none; }
  .metric-row-label{
    font-size:0.78rem;
    font-weight:500;
    color:var(--text-secondary);
  }
  .metric-row-val-wrap{
    position:relative;
    height:26px;
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  .metric-row-val{
    font-family:var(--font-mono);
    font-size:1.05rem;
    font-weight:500;
    color:var(--text-primary);
    letter-spacing:-0.01em;
    display:inline-block;
    transition:opacity .28s ease, transform .28s ease, filter .28s ease;
  }
  .metric-row-val.morphing{
    opacity:0;
    transform:translateY(-8px);
    filter:blur(2px);
  }
  .highlight-row .metric-row-val{ color:var(--accent); font-weight:600; }

  /* --- Simulated cursor --- */
  .fake-cursor{
    position:fixed;
    width:20px;height:20px;
    pointer-events:none;
    z-index:2000;
    opacity:0;
    transition:left .48s cubic-bezier(.4,.2,.2,1), top .48s cubic-bezier(.4,.2,.2,1), opacity .3s ease;
  }
  .fake-cursor.visible{ opacity:1; }
  .fake-cursor svg{ display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); width:20px; height:20px; transition:transform .15s ease; }
  .fake-cursor.pressed svg{ transform:scale(0.8); }

  .cursor-ripple{
    position:fixed;
    width:10px;height:10px;
    margin-left:-5px;margin-top:-5px;
    border-radius:50%;
    border:2px solid var(--accent);
    pointer-events:none;
    z-index:1999;
    animation:cursor-ripple .55s ease-out forwards;
  }
  @keyframes cursor-ripple{
    0%{ transform:scale(0.5); opacity:0.8; }
    100%{ transform:scale(3.2); opacity:0; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-head">
    <div>
      <div class="section-title">Valuation</div>
      <div class="chart-title">Projection Summary</div>
    </div>
    <div class="currency-toggle" id="currToggle">
      <div class="currency-indicator" id="currIndicator"></div>
      <button class="currency-btn active" data-cur="INR">₹</button>
      <button class="currency-btn" data-cur="USD">$</button>
      <button class="currency-btn" data-cur="EUR">€</button>
    </div>
  </div>

  <div class="metric-row">
    <div class="metric-row-label">Monthly SIP</div>
    <div class="metric-row-val-wrap"><span class="metric-row-val" id="valSip">₹25,000</span></div>
  </div>
  <div class="metric-row">
    <div class="metric-row-label">Total Investment</div>
    <div class="metric-row-val-wrap"><span class="metric-row-val" id="valInvested">₹60,00,000</span></div>
  </div>
  <div class="metric-row highlight-row">
    <div class="metric-row-label">Final Corpus</div>
    <div class="metric-row-val-wrap"><span class="metric-row-val" id="valCorpus">₹2,49,72,500</span></div>
  </div>
</div>

<script>
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// Base amounts in INR
const BASE = {
  sip: 25000,
  invested: 6000000,
  corpus: 24972500,
};

// Illustrative fixed conversion rates from INR
const RATES = {
  INR: { rate: 1,      symbol: '₹', locale: 'en-IN' },
  USD: { rate: 1/83.2, symbol: '$', locale: 'en-US' },
  EUR: { rate: 1/90.1, symbol: '€', locale: 'de-DE' },
};

const ORDER = ['INR', 'USD', 'EUR'];

function fmt(amount, cur){
  const c = RATES[cur];
  const val = amount * c.rate;
  const formatted = val.toLocaleString(c.locale, { maximumFractionDigits: 0 });
  return c.symbol + formatted;
}

const valSip = document.getElementById('valSip');
const valInvested = document.getElementById('valInvested');
const valCorpus = document.getElementById('valCorpus');
const currIndicator = document.getElementById('currIndicator');
const currButtons = Array.from(document.querySelectorAll('.currency-btn'));

async function morphTo(cur){
  const els = [valSip, valInvested, valCorpus];
  els.forEach(el => el.classList.add('morphing'));
  await sleep(220);

  valSip.textContent = fmt(BASE.sip, cur);
  valInvested.textContent = fmt(BASE.invested, cur);
  valCorpus.textContent = fmt(BASE.corpus, cur);

  await sleep(30);
  els.forEach(el => el.classList.remove('morphing'));

  currButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.cur === cur));
  const idx = ORDER.indexOf(cur);
  currIndicator.style.transform = `translateX(${idx * 100}%)`;

  await sleep(280);
}

// ---- Simulated cursor ----
function createFakeCursor(){
  const c = document.createElement('div');
  c.className = 'fake-cursor';
  c.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 3 L4 19 L8.3 15.2 L11 21 L13.6 19.9 L11 14.2 L17 14.2 Z" fill="#111827" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  document.body.appendChild(c);
  return c;
}
const fakeCursor = createFakeCursor();
const TIP_X = 3.4, TIP_Y = 2.6;
function cursorTo(x,y){
  fakeCursor.style.left = (x-TIP_X)+'px';
  fakeCursor.style.top = (y-TIP_Y)+'px';
}
async function moveCursor(x,y){
  if(!fakeCursor.classList.contains('visible')){
    cursorTo(x,y);
    fakeCursor.classList.add('visible');
    await sleep(60);
    return;
  }
  cursorTo(x,y);
  await sleep(460);
}
function spawnRipple(x,y){
  const r = document.createElement('div');
  r.className = 'cursor-ripple';
  r.style.left = x+'px';
  r.style.top = y+'px';
  document.body.appendChild(r);
  setTimeout(()=> r.remove(), 600);
}
async function clickCursor(x,y){
  await moveCursor(x,y);
  fakeCursor.classList.add('pressed');
  spawnRipple(x,y);
  await sleep(150);
  fakeCursor.classList.remove('pressed');
  await sleep(100);
}
function hideCursorEl(){ fakeCursor.classList.remove('visible'); }

function btnCenter(cur){
  const btn = currButtons.find(b => b.dataset.cur === cur);
  const rect = btn.getBoundingClientRect();
  return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
}

// ---- Auto-play loop ----
async function runCycle(){
  await morphTo('INR');
  await sleep(1600);

  for(const cur of ['USD', 'EUR', 'INR']){
    const pt = btnCenter(cur);
    await clickCursor(pt.x, pt.y);
    await morphTo(cur);
    await sleep(1700);
  }

  hideCursorEl();
  await sleep(700);
}

async function loop(){
  await runCycle();
  loop();
}
loop();
</script>
</body>
</html>
