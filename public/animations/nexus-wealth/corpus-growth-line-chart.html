<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YoY Corpus Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f9fafb;
    --border:#e5e7eb;
    --text-primary:#111827;
    --text-secondary:#4b5563;
    --accent:#064e3b;
    --font-serif:'Cormorant Garamond', Georgia, serif;
    --font-sans:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--bg-alt);
    padding:48px 20px;
    display:flex;
    justify-content:center;
  }

  .panel{
    width:500px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:1.5rem;
  }

  .chart-head{ margin-bottom:1.2rem; }
  .section-title{
    font-size:0.8rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--text-secondary);
    margin-bottom:2px;
  }
  .chart-title{
    font-family:var(--font-serif);
    font-size:1.15rem;
    font-weight:600;
    color:var(--text-primary);
  }

  .chart-wrap{
    position:relative;
    width:100%;
    height:280px;
  }
  svg{ width:100%; height:100%; display:block; overflow:visible; }

  .axis-line{ stroke:var(--border); stroke-width:1; }
  .grid-line{ stroke:var(--border); stroke-width:1; stroke-dasharray:2 3; }
  .tick-label{
    font-family:var(--font-mono);
    font-size:9.5px;
    fill:var(--text-secondary);
  }

  .corpus-path{
    fill:none;
    stroke:var(--accent);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .end-dot{
    fill:var(--accent);
    opacity:0;
    transition:opacity .3s ease;
  }
  .end-dot.show{ opacity:1; }

  .trace-dot{
    fill:#ffffff;
    stroke:var(--accent);
    stroke-width:2.4;
    opacity:0;
  }
  .trace-dot.show{ opacity:1; }

  .value-tooltip{
    position:absolute;
    transform:translate(-50%, -130%);
    background:var(--text-primary);
    color:#fff;
    font-family:var(--font-mono);
    font-size:11px;
    padding:5px 9px;
    white-space:nowrap;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }
  .value-tooltip.show{ opacity:1; }
  .value-tooltip .yr{
    font-family:var(--font-sans);
    color:#9ca3af;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-right:6px;
  }

  /* --- Simulated cursor --- */
  .fake-cursor{
    position:fixed;
    width:20px;height:20px;
    pointer-events:none;
    z-index:2000;
    opacity:0;
    transition:opacity .3s ease;
  }
  .fake-cursor.visible{ opacity:1; }
  .fake-cursor svg{ display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); width:20px; height:20px; overflow:visible; }
</style>
</head>
<body>

<div class="panel">
  <div class="chart-head">
    <div class="section-title">Projection</div>
    <div class="chart-title">Year-on-Year Corpus Growth</div>
  </div>
  <div class="chart-wrap" id="chartWrap">
    <svg id="chartSvg" viewBox="0 0 500 280">
      <g id="gridGroup"></g>
      <g id="axisGroup"></g>
      <path class="corpus-path" id="corpusPath" d="" />
      <circle class="trace-dot" id="traceDot" r="4"></circle>
      <circle class="end-dot" id="endDot" r="4"></circle>
    </svg>
    <div class="value-tooltip" id="tooltip"><span class="yr" id="tooltipYear">Year 0</span><span id="tooltipVal">₹0</span></div>
  </div>
</div>

<script>
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// ---- Layout ----
const PAD_L = 52, PAD_R = 14, PAD_T = 14, PAD_B = 28;
const VB_W = 500, VB_H = 280;
const plotW = VB_W - PAD_L - PAD_R;
const plotH = VB_H - PAD_T - PAD_B;

// ---- Data: simulated SIP compounding over 20 years ----
const YEARS = 20;
const MONTHLY_SIP = 25000;
const ANNUAL_RATE = 0.12;
const i = ANNUAL_RATE / 12;

function corpusAtYear(year){
  const months = year * 12;
  if(months === 0) return 0;
  return MONTHLY_SIP * ((Math.pow(1+i, months) - 1) / i) * (1+i);
}

const points = [];
for(let y=0; y<=YEARS; y++){
  points.push({ year: y, value: corpusAtYear(y) });
}
const maxVal = points[points.length-1].value;

function xFor(year){ return PAD_L + (year/YEARS) * plotW; }
function yFor(value){ return PAD_T + plotH - (value/maxVal) * plotH; }

function fmtCompact(n){
  if(n >= 1e7) return '₹' + (n/1e7).toFixed(2) + 'Cr';
  if(n >= 1e5) return '₹' + (n/1e5).toFixed(1) + 'L';
  if(n >= 1e3) return '₹' + Math.round(n/1e3) + 'k';
  return '₹' + Math.round(n);
}
function fmtFull(n){
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

// ---- Draw axes + grid ----
const gridGroup = document.getElementById('gridGroup');
const axisGroup = document.getElementById('axisGroup');
const svgNS = 'http://www.w3.org/2000/svg';

function addLine(group, x1,y1,x2,y2,cls){
  const l = document.createElementNS(svgNS,'line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1);
  l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('class', cls);
  group.appendChild(l);
}
function addText(group, x, y, text, anchor){
  const t = document.createElementNS(svgNS,'text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('class','tick-label');
  t.setAttribute('text-anchor', anchor || 'middle');
  t.textContent = text;
  group.appendChild(t);
}

// Y axis ticks (0, mid, max)
[0, 0.5, 1].forEach(frac=>{
  const val = maxVal * frac;
  const y = yFor(val);
  addLine(gridGroup, PAD_L, y, VB_W-PAD_R, y, 'grid-line');
  addText(axisGroup, PAD_L - 10, y+3, fmtCompact(val), 'end');
});

// X axis ticks every 5 years
for(let y=0; y<=YEARS; y+=5){
  const x = xFor(y);
  addText(axisGroup, x, VB_H - 8, 'Y' + y, 'middle');
}
addLine(axisGroup, PAD_L, PAD_T + plotH, VB_W - PAD_R, PAD_T + plotH, 'axis-line');

// ---- Build path ----
const pathD = points.map((p,idx)=>{
  const x = xFor(p.year);
  const y = yFor(p.value);
  return (idx===0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
}).join(' ');

const corpusPath = document.getElementById('corpusPath');
corpusPath.setAttribute('d', pathD);
const pathLength = corpusPath.getTotalLength();
corpusPath.style.strokeDasharray = pathLength;
corpusPath.style.strokeDashoffset = pathLength;

const endDot = document.getElementById('endDot');
const finalPoint = points[points.length-1];
endDot.setAttribute('cx', xFor(finalPoint.year));
endDot.setAttribute('cy', yFor(finalPoint.value));

const traceDot = document.getElementById('traceDot');
const chartSvg = document.getElementById('chartSvg');
const tooltip = document.getElementById('tooltip');
const tooltipYear = document.getElementById('tooltipYear');
const tooltipVal = document.getElementById('tooltipVal');

function svgToScreen(x, y){
  const rect = chartSvg.getBoundingClientRect();
  return {
    x: rect.left + (x / VB_W) * rect.width,
    y: rect.top + (y / VB_H) * rect.height,
  };
}

// ---- Simulated cursor ----
function createFakeCursor(){
  const c = document.createElement('div');
  c.className = 'fake-cursor';
  c.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 3 L4 19 L8.3 15.2 L11 21 L13.6 19.9 L11 14.2 L17 14.2 Z" fill="#111827" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  document.body.appendChild(c);
  return c;
}
const fakeCursor = createFakeCursor();
const TIP_X = 3.4, TIP_Y = 2.6;
function cursorTo(x,y){
  fakeCursor.style.left = (x-TIP_X)+'px';
  fakeCursor.style.top = (y-TIP_Y)+'px';
}

// ---- Draw-in animation ----
function drawLine(duration){
  return new Promise(resolve=>{
    corpusPath.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(.4,.1,.2,1)`;
    requestAnimationFrame(()=>{
      corpusPath.style.strokeDashoffset = '0';
    });
    setTimeout(resolve, duration);
  });
}
function resetLine(){
  corpusPath.style.transition = 'none';
  corpusPath.style.strokeDashoffset = pathLength;
  endDot.classList.remove('show');
}

// ---- Cursor trace along the finished line, showing value tooltip ----
function traceAlongPath(duration){
  return new Promise(resolve=>{
    traceDot.classList.add('show');
    tooltip.classList.add('show');
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now-start)/duration);
      const len = t * pathLength;
      const pt = corpusPath.getPointAtLength(len);
      traceDot.setAttribute('cx', pt.x);
      traceDot.setAttribute('cy', pt.y);

      const screenPt = svgToScreen(pt.x, pt.y);
      cursorTo(screenPt.x, screenPt.y);

      const yearNow = t * YEARS;
      const valueNow = corpusAtYear(Math.round(yearNow));
      tooltipYear.textContent = 'Year ' + Math.round(yearNow);
      tooltipVal.textContent = fmtFull(valueNow);
      const chartRect = document.getElementById('chartWrap').getBoundingClientRect();
      tooltip.style.left = (pt.x / VB_W) * chartRect.width + 'px';
      tooltip.style.top = (pt.y / VB_H) * chartRect.height + 'px';

      if(t<1){ requestAnimationFrame(step); }
      else { resolve(); }
    }
    requestAnimationFrame(step);
  });
}

async function runCycle(){
  resetLine();
  traceDot.classList.remove('show');
  tooltip.classList.remove('show');

  await sleep(600);
  await drawLine(1600);
  endDot.classList.add('show');

  await sleep(300);

  // cursor appears at chart start, then traces the finished line
  const startScreen = svgToScreen(xFor(0), yFor(0));
  cursorTo(startScreen.x, startScreen.y);
  fakeCursor.classList.add('visible');
  await sleep(200);

  await traceAlongPath(2200);
  await sleep(1200);

  tooltip.classList.remove('show');
  traceDot.classList.remove('show');
  fakeCursor.classList.remove('visible');
  await sleep(700);
}

async function loop(){
  await runCycle();
  loop();
}
loop();
</script>
</body>
</html>
