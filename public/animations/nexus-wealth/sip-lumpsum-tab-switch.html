<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIP / Lumpsum Strategy Switch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f9fafb;
    --border:#e5e7eb;
    --text-primary:#111827;
    --text-secondary:#4b5563;
    --accent:#064e3b;
    --accent-hover:#047857;
    --accent-light:#f0fdf4;
    --invested:#9ca3af;
    --returns:#10b981;
    --font-serif:'Cormorant Garamond', Georgia, serif;
    --font-sans:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--bg-alt);
    padding:48px 20px;
    display:flex;
    justify-content:center;
  }

  .panel{
    width:460px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:2rem;
  }

  .wordmark{
    font-family:var(--font-serif);
    font-size:1.3rem;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:2px;
  }
  .tagline{
    font-family:var(--font-serif);
    font-style:italic;
    font-size:0.9rem;
    color:var(--text-secondary);
    margin-bottom:1.6rem;
  }

  /* --- Tab switcher --- */
  .strategy-tab-container{
    position:relative;
    display:flex;
    border:1px solid var(--border);
    margin-bottom:1.8rem;
  }
  .strategy-tab-btn{
    flex:1;
    text-align:center;
    padding:0.65rem 0.4rem;
    font-family:var(--font-sans);
    font-size:0.75rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-secondary);
    background:transparent;
    border:none;
    cursor:default;
    position:relative;
    z-index:2;
    transition:color .35s ease;
  }
  .strategy-tab-btn.active{
    color:#ffffff;
  }
  .tab-indicator{
    position:absolute;
    top:0;
    left:0;
    width:50%;
    height:100%;
    background:var(--accent);
    z-index:1;
    transition:transform .5s cubic-bezier(.65,0,.35,1);
  }
  .tab-indicator.right{
    transform:translateX(100%);
  }

  /* --- Parameter panel (crossfades between strategies) --- */
  .params-wrap{
    position:relative;
    min-height:190px;
    margin-bottom:1.8rem;
  }
  .params{
    position:absolute;
    inset:0;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  .params.visible{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .parameter-control{ margin-bottom:1.1rem; }
  .parameter-label{
    display:block;
    font-size:0.78rem;
    font-weight:500;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .parameter-input-wrapper{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    padding:0.5rem 0.7rem;
    margin-bottom:8px;
  }
  .parameter-input-prefix{
    font-family:var(--font-mono);
    font-size:0.85rem;
    color:var(--text-secondary);
    margin-right:6px;
  }
  .parameter-value{
    font-family:var(--font-mono);
    font-size:0.9rem;
    font-weight:500;
    color:var(--text-primary);
    letter-spacing:-0.01em;
  }
  .slider-track{
    height:2px;
    background:var(--border);
    position:relative;
  }
  .slider-fill{
    position:absolute;
    top:0;left:0;
    height:100%;
    background:var(--accent);
    transition:width 1s cubic-bezier(.4,.1,.2,1);
  }
  .slider-thumb{
    position:absolute;
    top:50%;
    width:10px;height:10px;
    background:var(--accent);
    transform:translate(-50%,-50%);
    transition:left 1s cubic-bezier(.4,.1,.2,1);
  }

  /* --- Milestone cards --- */
  .milestones-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
  }
  .metric-card{
    background:var(--bg);
    padding:1rem 1rem 1.1rem;
  }
  .metric-card.accent-border{
    border-top:2px solid var(--accent);
  }
  .metric-label{
    font-size:0.65rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .metric-val{
    font-family:var(--font-mono);
    font-size:1.35rem;
    font-weight:500;
    letter-spacing:-0.02em;
    color:var(--text-primary);
  }
  .metric-card.accent-border .metric-val{ color:var(--accent); }

  /* --- Simulated cursor --- */
  .fake-cursor{
    position:fixed;
    width:20px;height:20px;
    pointer-events:none;
    z-index:2000;
    opacity:0;
    transition:left .5s cubic-bezier(.4,.2,.2,1), top .5s cubic-bezier(.4,.2,.2,1), opacity .3s ease;
  }
  .fake-cursor.visible{ opacity:1; }
  .fake-cursor svg{ display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); transition:transform .15s ease; }
  .fake-cursor.pressed svg{ transform:scale(0.8); }

  .cursor-ripple{
    position:fixed;
    width:10px;height:10px;
    margin-left:-5px;margin-top:-5px;
    border-radius:50%;
    border:2px solid var(--accent);
    pointer-events:none;
    z-index:1999;
    animation:cursor-ripple .55s ease-out forwards;
  }
  @keyframes cursor-ripple{
    0%{ transform:scale(0.5); opacity:0.8; }
    100%{ transform:scale(3.4); opacity:0; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="wordmark">Nexus Wealth</div>
  <div class="tagline">Wealth Projection Studio</div>

  <div class="strategy-tab-container" role="tablist">
    <div class="tab-indicator" id="tabIndicator"></div>
    <button class="strategy-tab-btn active" id="tabSip">SIP Strategy</button>
    <button class="strategy-tab-btn" id="tabLumpsum">Lumpsum Strategy</button>
  </div>

  <div class="params-wrap">
    <div class="params visible" id="paramsSip">
      <div class="parameter-control">
        <label class="parameter-label">Monthly SIP</label>
        <div class="parameter-input-wrapper">
          <span class="parameter-input-prefix">₹</span>
          <span class="parameter-value" id="sipAmountVal">25,000</span>
        </div>
        <div class="slider-track">
          <div class="slider-fill" id="sipFill" style="width:25%"></div>
          <div class="slider-thumb" id="sipThumb" style="left:25%"></div>
        </div>
      </div>
      <div class="parameter-control">
        <label class="parameter-label">Annual Step-Up</label>
        <div class="parameter-input-wrapper">
          <span class="parameter-value">10</span>
          <span class="parameter-input-prefix" style="margin-left:4px;margin-right:0;">%</span>
        </div>
      </div>
    </div>

    <div class="params" id="paramsLumpsum">
      <div class="parameter-control">
        <label class="parameter-label">Lumpsum Amount</label>
        <div class="parameter-input-wrapper">
          <span class="parameter-input-prefix">₹</span>
          <span class="parameter-value" id="lumpAmountVal">15,00,000</span>
        </div>
        <div class="slider-track">
          <div class="slider-fill" id="lumpFill" style="width:60%"></div>
          <div class="slider-thumb" id="lumpThumb" style="left:60%"></div>
        </div>
      </div>
      <div class="parameter-control">
        <label class="parameter-label">Compounding Rate</label>
        <div class="parameter-input-wrapper">
          <span class="parameter-value">12</span>
          <span class="parameter-input-prefix" style="margin-left:4px;margin-right:0;">%</span>
        </div>
      </div>
    </div>
  </div>

  <div class="milestones-grid">
    <div class="metric-card">
      <div class="metric-label">Total Investment</div>
      <div class="metric-val" id="investedVal">₹0</div>
    </div>
    <div class="metric-card accent-border">
      <div class="metric-label">Final Corpus</div>
      <div class="metric-val" id="corpusVal">₹0</div>
    </div>
  </div>
</div>

<script>
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// ---- Simulated cursor ----
function createFakeCursor(){
  const c = document.createElement('div');
  c.className = 'fake-cursor';
  c.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 3 L4 19 L8.3 15.2 L11 21 L13.6 19.9 L11 14.2 L17 14.2 Z" fill="#111827" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  document.body.appendChild(c);
  return c;
}
const fakeCursor = createFakeCursor();
const TIP_X = 3.4, TIP_Y = 2.6;
function cursorTo(x,y){
  fakeCursor.style.left = (x-TIP_X)+'px';
  fakeCursor.style.top = (y-TIP_Y)+'px';
}
async function moveCursor(x,y){
  if(!fakeCursor.classList.contains('visible')){
    cursorTo(x,y);
    fakeCursor.classList.add('visible');
    await sleep(60);
    return;
  }
  cursorTo(x,y);
  await sleep(500);
}
function spawnRipple(x,y){
  const r = document.createElement('div');
  r.className = 'cursor-ripple';
  r.style.left = x+'px';
  r.style.top = y+'px';
  document.body.appendChild(r);
  setTimeout(()=> r.remove(), 600);
}
async function clickCursor(x,y){
  await moveCursor(x,y);
  fakeCursor.classList.add('pressed');
  spawnRipple(x,y);
  await sleep(150);
  fakeCursor.classList.remove('pressed');
  await sleep(120);
}
function hideCursorEl(){ fakeCursor.classList.remove('visible'); }

const tabSip = document.getElementById('tabSip');
const tabLumpsum = document.getElementById('tabLumpsum');
const tabIndicator = document.getElementById('tabIndicator');
const paramsSip = document.getElementById('paramsSip');
const paramsLumpsum = document.getElementById('paramsLumpsum');
const investedVal = document.getElementById('investedVal');
const corpusVal = document.getElementById('corpusVal');

function formatINR(n){
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

// Easing count-up animation for a number element
function animateNumber(el, from, to, duration){
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/duration);
    const ease = 1 - Math.pow(1-t, 3);
    const val = from + (to-from)*ease;
    el.textContent = formatINR(val);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = formatINR(to);
  }
  requestAnimationFrame(step);
}

const SCENARIOS = {
  sip:      { invested: 6000000, corpus: 15420000 },
  lumpsum:  { invested: 1500000, corpus: 4658000 },
};

let current = { invested: 0, corpus: 0 };

function goTo(mode){
  const target = SCENARIOS[mode];
  animateNumber(investedVal, current.invested, target.invested, 900);
  animateNumber(corpusVal, current.corpus, target.corpus, 900);
  current = { ...target };

  if(mode === 'sip'){
    tabSip.classList.add('active');
    tabLumpsum.classList.remove('active');
    tabIndicator.classList.remove('right');
    paramsSip.classList.add('visible');
    paramsLumpsum.classList.remove('visible');
  } else {
    tabLumpsum.classList.add('active');
    tabSip.classList.remove('active');
    tabIndicator.classList.add('right');
    paramsLumpsum.classList.add('visible');
    paramsSip.classList.remove('visible');
  }
}

async function autoLoop(){
  goTo('sip');
  await sleep(1400);

  const lumpRect = tabLumpsum.getBoundingClientRect();
  await clickCursor(lumpRect.left + lumpRect.width/2, lumpRect.top + lumpRect.height/2);
  goTo('lumpsum');
  await sleep(2600);

  const sipRect = tabSip.getBoundingClientRect();
  await clickCursor(sipRect.left + sipRect.width/2, sipRect.top + sipRect.height/2);
  goTo('sip');
  await sleep(2600);

  hideCursorEl();
  await sleep(600);
  autoLoop();
}
autoLoop();
</script>
</body>
</html>
