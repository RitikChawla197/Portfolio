<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slider-driven Recalculation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f9fafb;
    --border:#e5e7eb;
    --text-primary:#111827;
    --text-secondary:#4b5563;
    --accent:#064e3b;
    --font-serif:'Cormorant Garamond', Georgia, serif;
    --font-sans:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--bg-alt);
    padding:48px 20px;
    display:flex;
    justify-content:center;
  }

  .panel{
    width:460px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:2rem;
  }

  .section-title{
    font-size:0.8rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--text-secondary);
    margin-bottom:2px;
  }
  .chart-title{
    font-family:var(--font-serif);
    font-size:1.15rem;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:1.6rem;
  }

  .parameter-control{ margin-bottom:1.8rem; }
  .parameter-label{
    display:block;
    font-size:0.78rem;
    font-weight:500;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .parameter-input-wrapper{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    padding:0.55rem 0.75rem;
    margin-bottom:12px;
    width:fit-content;
    transition:border-color .2s ease;
  }
  .parameter-input-wrapper.active-focus{
    border-color:var(--accent);
  }
  .parameter-input-prefix{
    font-family:var(--font-mono);
    font-size:0.9rem;
    color:var(--text-secondary);
    margin-right:6px;
  }
  .parameter-value{
    font-family:var(--font-mono);
    font-size:1rem;
    font-weight:500;
    color:var(--text-primary);
    letter-spacing:-0.01em;
    min-width:80px;
  }

  .slider-track{
    height:2px;
    background:var(--border);
    position:relative;
    margin:0 5px;
  }
  .slider-fill{
    position:absolute;
    top:0;left:0;
    height:100%;
    background:var(--accent);
  }
  .slider-thumb{
    position:absolute;
    top:50%;
    width:12px;height:12px;
    background:var(--accent);
    transform:translate(-50%,-50%) scale(1);
    transition:transform .15s ease;
  }
  .slider-thumb.grabbed{
    transform:translate(-50%,-50%) scale(1.35);
  }

  .milestones-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
  }
  .metric-card{
    background:var(--bg);
    padding:1rem 1rem 1.1rem;
  }
  .metric-card.accent-border{
    border-top:2px solid var(--accent);
  }
  .metric-label{
    font-size:0.65rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .metric-val{
    font-family:var(--font-mono);
    font-size:1.35rem;
    font-weight:500;
    letter-spacing:-0.02em;
    color:var(--text-primary);
  }
  .metric-card.accent-border .metric-val{ color:var(--accent); }

  /* --- Simulated cursor --- */
  .fake-cursor{
    position:fixed;
    width:20px;height:20px;
    pointer-events:none;
    z-index:2000;
    opacity:0;
    transition:opacity .3s ease;
  }
  .fake-cursor.visible{ opacity:1; }
  .fake-cursor svg{ display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); width:20px; height:20px; }
  .fake-cursor.pressed svg{ transform:scale(0.82); }
</style>
</head>
<body>

<div class="panel">
  <div class="section-title">Accumulation Phase</div>
  <div class="chart-title">Monthly SIP</div>

  <div class="parameter-control">
    <label class="parameter-label">Monthly Contribution</label>
    <div class="parameter-input-wrapper" id="inputWrapper">
      <span class="parameter-input-prefix">₹</span>
      <span class="parameter-value" id="sipVal">25,000</span>
    </div>
    <div class="slider-track" id="sliderTrack">
      <div class="slider-fill" id="sliderFill"></div>
      <div class="slider-thumb" id="sliderThumb"></div>
    </div>
  </div>

  <div class="milestones-grid">
    <div class="metric-card">
      <div class="metric-label">Total Investment</div>
      <div class="metric-val" id="investedVal">₹0</div>
    </div>
    <div class="metric-card accent-border">
      <div class="metric-label">Final Corpus</div>
      <div class="metric-val" id="corpusVal">₹0</div>
    </div>
  </div>
</div>

<script>
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

const MIN_SIP = 5000, MAX_SIP = 100000;
const YEARS = 20;
const ANNUAL_RATE = 0.12;
const i = ANNUAL_RATE / 12;
const months = YEARS * 12;

const sliderTrack = document.getElementById('sliderTrack');
const sliderFill = document.getElementById('sliderFill');
const sliderThumb = document.getElementById('sliderThumb');
const sipVal = document.getElementById('sipVal');
const investedVal = document.getElementById('investedVal');
const corpusVal = document.getElementById('corpusVal');
const inputWrapper = document.getElementById('inputWrapper');

function fmtINR(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

function setSip(amount){
  amount = Math.max(MIN_SIP, Math.min(MAX_SIP, amount));
  const pct = (amount - MIN_SIP) / (MAX_SIP - MIN_SIP);
  sliderFill.style.width = (pct*100) + '%';
  sliderThumb.style.left = (pct*100) + '%';
  sipVal.textContent = Math.round(amount).toLocaleString('en-IN');

  const invested = amount * months;
  const corpus = amount * ((Math.pow(1+i, months) - 1) / i) * (1+i);
  investedVal.textContent = fmtINR(invested);
  corpusVal.textContent = fmtINR(corpus);
}

setSip(25000);

// ---- Simulated cursor ----
function createFakeCursor(){
  const c = document.createElement('div');
  c.className = 'fake-cursor';
  c.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 3 L4 19 L8.3 15.2 L11 21 L13.6 19.9 L11 14.2 L17 14.2 Z" fill="#111827" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  document.body.appendChild(c);
  return c;
}
const fakeCursor = createFakeCursor();
const TIP_X = 3.4, TIP_Y = 2.6;
function cursorTo(x,y){
  fakeCursor.style.left = (x-TIP_X)+'px';
  fakeCursor.style.top = (y-TIP_Y)+'px';
}
async function moveCursor(x,y,duration){
  if(!fakeCursor.classList.contains('visible')){
    cursorTo(x,y);
    fakeCursor.classList.add('visible');
    await sleep(60);
    return;
  }
  fakeCursor.style.transition = `opacity .3s ease, left ${duration}ms cubic-bezier(.4,.2,.2,1), top ${duration}ms cubic-bezier(.4,.2,.2,1)`;
  cursorTo(x,y);
  await sleep(duration);
}
function hideCursorEl(){ fakeCursor.classList.remove('visible'); }

function trackPointForAmount(amount){
  const rect = sliderTrack.getBoundingClientRect();
  const pct = (amount - MIN_SIP) / (MAX_SIP - MIN_SIP);
  return { x: rect.left + pct * rect.width, y: rect.top + rect.height/2 };
}

// Drag the thumb from one amount to another, updating numbers every frame
function dragTo(fromAmount, toAmount, duration){
  return new Promise(resolve=>{
    fakeCursor.style.transition = 'opacity .3s ease';
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now-start)/duration);
      const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      const amount = fromAmount + (toAmount-fromAmount)*ease;
      setSip(amount);
      const pt = trackPointForAmount(amount);
      cursorTo(pt.x, pt.y);
      if(t<1){ requestAnimationFrame(step); }
      else { resolve(); }
    }
    requestAnimationFrame(step);
  });
}

async function runCycle(){
  setSip(15000);
  await sleep(700);

  // move cursor to the thumb
  const startPt = trackPointForAmount(15000);
  await moveCursor(startPt.x, startPt.y, 500);

  // grab
  sliderThumb.classList.add('grabbed');
  inputWrapper.classList.add('active-focus');
  fakeCursor.classList.add('pressed');
  await sleep(160);

  // drag up
  await dragTo(15000, 92000, 1700);
  await sleep(500);

  // drag back down
  await dragTo(92000, 38000, 1500);
  await sleep(500);

  // release
  fakeCursor.classList.remove('pressed');
  sliderThumb.classList.remove('grabbed');
  inputWrapper.classList.remove('active-focus');
  await sleep(1000);

  hideCursorEl();
  await sleep(700);
}

async function loop(){
  await runCycle();
  loop();
}
loop();
</script>
</body>
</html>
