<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignee Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans', system-ui, sans-serif;
    background:#f2f3f6;
    padding:60px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:44px;
  }
  .mono{font-family:'Geist Mono', monospace;}

  .card{
    background:#ffffff;
    border:1px solid #e7e9ee;
    border-radius:10px;
    padding:14px 16px;
    width:320px;
    box-shadow:0 1px 2px rgba(16,24,40,0.05);
  }
  .card-title{
    font-size:13px;
    font-weight:600;
    color:#0b0e14;
    margin-bottom:4px;
  }
  .card-sub{
    font-size:11px;
    color:#9096a3;
    margin-bottom:14px;
  }

  .stack-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .badge{
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:2px 6px;
    border-radius:4px;
    color:#fff;
    background:#ef4444;
  }

  .stack{
    position:relative;
    height:30px;
    display:flex;
    align-items:center;
  }

  .avatar{
    position:absolute;
    top:0;
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Geist Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:#fff;
    border:2.5px solid #ffffff;
    box-shadow:0 1px 3px rgba(16,24,40,0.15);
    transition:transform .38s cubic-bezier(.34,1.3,.4,1), box-shadow .3s ease, z-index 0s;
    user-select:none;
  }

  .avatar .tip{
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    background:#0b0e14;
    color:#fff;
    font-family:'DM Sans', sans-serif;
    font-size:10px;
    font-weight:600;
    padding:4px 8px;
    border-radius:6px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .avatar .tip::after{
    content:'';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:4px solid transparent;
    border-top-color:#0b0e14;
  }
  .avatar.show-tip .tip{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .avatar.more{
    background:#eef0f3;
    color:#6b7280;
    font-size:10px;
  }

  .section-label{
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#9096a3;
    margin-bottom:10px;
  }

  /* --- Simulated cursor --- */
  .fake-cursor{
    position:fixed;
    width:20px;height:20px;
    pointer-events:none;
    z-index:2000;
    opacity:0;
    transition:left .5s cubic-bezier(.4,.2,.2,1), top .5s cubic-bezier(.4,.2,.2,1), opacity .3s ease;
  }
  .fake-cursor.visible{ opacity:1; }
  .fake-cursor svg{ display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }
</style>
</head>
<body>

<div>
  <div class="section-label" style="text-align:center;">Animated preview</div>
</div>

<div class="card">
  <div class="card-title">Kanban drag-and-drop for mobile touch</div>
  <div class="card-sub">TSK-129 · Due Aug 14</div>
  <div class="stack-row">
    <span class="badge">High</span>
    <div class="stack" id="stack"></div>
  </div>
</div>

<script>
const people = [
  {init:'AR', name:'Aisha Reyes', color:'#2563eb'},
  {init:'JM', name:'Jordan Marsh', color:'#9333ea'},
  {init:'KP', name:'Kai Park', color:'#16a34a'},
  {init:'DL', name:'Dana Liu', color:'#ea580c'},
  {init:'TS', name:'Theo Sato', color:'#0891b2'},
];

const OVERLAP = 18;
const GAP = 38;
const MAX_VISIBLE = 4;

const stackEl = document.getElementById('stack');
const visible = people.slice(0, MAX_VISIBLE);
const overflowCount = people.length - visible.length;

visible.forEach((p, i)=>{
  const el = document.createElement('div');
  el.className = 'avatar';
  el.style.background = p.color;
  el.style.left = (i * OVERLAP) + 'px';
  el.style.zIndex = visible.length - i;
  el.innerHTML = `${p.init}<span class="tip">${p.name}</span>`;
  stackEl.appendChild(el);
});

if(overflowCount > 0){
  const more = document.createElement('div');
  more.className = 'avatar more';
  more.style.left = (visible.length * OVERLAP) + 'px';
  more.style.zIndex = 0;
  more.innerHTML = `+${overflowCount}<span class="tip">${people.slice(MAX_VISIBLE).map(p=>p.name).join(', ')}</span>`;
  stackEl.appendChild(more);
}

stackEl.style.width = ((visible.length + (overflowCount>0?1:0)) * OVERLAP + 30) + 'px';

const avatarEls = Array.from(stackEl.querySelectorAll('.avatar'));

function fanOut(){
  stackEl.classList.add('is-fanned');
  avatarEls.forEach((el, i)=>{
    el.style.left = (i * GAP) + 'px';
    el.style.zIndex = 50 + i;
  });
  stackEl.style.width = (avatarEls.length * GAP + 30) + 'px';
  avatarEls.forEach((el, i)=> setTimeout(()=> el.classList.add('show-tip'), 120 + i*40));
}

function fanIn(){
  stackEl.classList.remove('is-fanned');
  avatarEls.forEach(el=> el.classList.remove('show-tip'));
  avatarEls.forEach((el, i)=>{
    el.style.left = (i * OVERLAP) + 'px';
    el.style.zIndex = avatarEls.length - i;
  });
  stackEl.style.width = ((visible.length + (overflowCount>0?1:0)) * OVERLAP + 30) + 'px';
}

// ---- Simulated cursor ----
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function createFakeCursor(){
  const c = document.createElement('div');
  c.className = 'fake-cursor';
  c.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 3 L4 19 L8.3 15.2 L11 21 L13.6 19.9 L11 14.2 L17 14.2 Z" fill="#1a1d27" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  document.body.appendChild(c);
  return c;
}
const fakeCursor = createFakeCursor();
const TIP_X = 3.4, TIP_Y = 2.6;
function cursorTo(x,y){
  fakeCursor.style.left = (x-TIP_X)+'px';
  fakeCursor.style.top = (y-TIP_Y)+'px';
}
async function moveCursor(x,y){
  if(!fakeCursor.classList.contains('visible')){
    cursorTo(x,y);
    fakeCursor.classList.add('visible');
    await sleep(60);
    return;
  }
  cursorTo(x,y);
  await sleep(500);
}
function hideCursorEl(){ fakeCursor.classList.remove('visible'); }

// ---- Auto-play loop ----
async function autoLoop(){
  await sleep(1300);
  const rect = stackEl.getBoundingClientRect();
  await moveCursor(rect.left + rect.width/2, rect.top + rect.height/2);
  fanOut();
  await sleep(2200);
  fanIn();
  hideCursorEl();
  await sleep(1600);
  autoLoop();
}
autoLoop();
</script>
</body>
</html>
