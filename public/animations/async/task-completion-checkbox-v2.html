<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Completion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans', system-ui, sans-serif;
    background:#f2f3f6;
    padding:40px 20px;
    display:flex;
    justify-content:center;
  }
  .mono{font-family:'Geist Mono', monospace;}

  .panel{
    background:#fff;
    border:1px solid #e7e9ee;
    border-radius:14px;
    padding:18px;
    width:380px;
    box-shadow:0 1px 2px rgba(16,24,40,0.05);
  }

  .head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .head-title{font-size:14px;font-weight:800;color:#0b0e14;letter-spacing:-0.01em;}
  .head-sub{font-size:10.5px;color:#9096a3;margin-top:2px;}

  .progress-badge{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .progress-ring{
    width:28px;height:28px;
    position:relative;
  }
  .progress-ring svg{ transform:rotate(-90deg); width:28px;height:28px; }
  .progress-ring circle{
    fill:none;
    stroke-width:3;
  }
  .ring-bg{stroke:#eef0f3;}
  .ring-fill{
    stroke:#16a34a;
    stroke-linecap:round;
    transition:stroke-dashoffset .5s cubic-bezier(.4,.2,.2,1);
  }
  .progress-count{
    font-size:10px;
    font-weight:700;
    color:#6b7280;
    font-family:'Geist Mono',monospace;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .task{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 10px;
    border:1px solid #e7e9ee;
    border-radius:9px;
    background:#fff;
    transition:background .35s ease, border-color .35s ease, transform .3s ease, opacity .35s ease, max-height .35s ease, margin .35s ease, padding .35s ease;
    cursor:default;
    overflow:hidden;
  }
  .task.done{
    background:#fafbfc;
    border-color:#eef0f3;
  }

  .checkbox{
    width:19px;height:19px;
    border-radius:6px;
    border:2px solid #d5d9e0;
    flex-shrink:0;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:border-color .25s ease, background .25s ease, transform .2s cubic-bezier(.34,1.6,.5,1);
    background:#fff;
  }
  .task:hover .checkbox{ border-color:#9ca6b5; }
  .task.done .checkbox{
    background:#16a34a;
    border-color:#16a34a;
    transform:scale(1.08);
  }
  .checkbox svg{
    width:12px;height:12px;
    stroke:#fff;
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .checkbox .tick{
    stroke-dasharray:16;
    stroke-dashoffset:16;
  }
  .task.done .checkbox .tick{
    animation:draw-tick .34s ease-out .05s forwards;
  }
  @keyframes draw-tick{ to{ stroke-dashoffset:0; } }

  .ripple{
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:2px solid #16a34a;
    opacity:0;
    transform:scale(0.5);
  }
  .task.done .ripple{
    animation:ripple .5s ease-out;
  }
  @keyframes ripple{
    0%{ opacity:0.6; transform:scale(0.5); }
    100%{ opacity:0; transform:scale(1.6); }
  }

  .task-body{flex:1;min-width:0;}
  .task-title{
    font-size:12.5px;
    font-weight:600;
    color:#0b0e14;
    line-height:1.35;
    position:relative;
    transition:color .35s ease;
  }
  .task.done .task-title{ color:#9ca3af; }

  .strike{
    position:absolute;
    left:0;top:50%;
    height:1.4px;
    width:0;
    background:#9ca3af;
    transition:width .32s ease .05s;
  }
  .task.done .strike{ width:100%; }

  .task-meta{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:5px;
    transition:opacity .3s ease;
  }
  .task.done .task-meta{ opacity:0.5; }

  .badge{
    font-size:8.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:2px 6px;
    border-radius:4px;
    color:#fff;
  }
  .badge.high{background:#ef4444;}
  .badge.med{background:#eab308;color:#1a1400;}
  .badge.low{background:#22c55e;color:#04270f;}

  .avatar{
    width:15px;height:15px;
    border-radius:50%;
    background:#dbe1ea;
    color:#3a4354;
    font-size:7.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Geist Mono',monospace;
    flex-shrink:0;
  }

  .hint{
    text-align:center;
    font-size:10.5px;
    color:#c7cbd3;
    margin-top:14px;
  }

  /* --- Simulated cursor --- */
  .fake-cursor{
    position:fixed;
    width:20px;height:20px;
    pointer-events:none;
    z-index:2000;
    opacity:0;
    transition:left .46s cubic-bezier(.4,.2,.2,1), top .46s cubic-bezier(.4,.2,.2,1), opacity .25s ease;
  }
  .fake-cursor.visible{ opacity:1; }
  .fake-cursor svg{ display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3)); transition:transform .15s ease; }
  .fake-cursor.pressed svg{ transform:scale(0.8); }

  .cursor-ripple{
    position:fixed;
    width:10px;height:10px;
    margin-left:-5px;margin-top:-5px;
    border-radius:50%;
    border:2px solid #16a34a;
    pointer-events:none;
    z-index:1999;
    animation:cursor-ripple .55s ease-out forwards;
  }
  @keyframes cursor-ripple{
    0%{ transform:scale(0.5); opacity:0.8; }
    100%{ transform:scale(3.2); opacity:0; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="head">
    <div>
      <div class="head-title">Today's tasks</div>
      <div class="head-sub">Animated preview</div>
    </div>
    <div class="progress-badge">
      <div class="progress-ring">
        <svg viewBox="0 0 28 28">
          <circle class="ring-bg" cx="14" cy="14" r="11.5"></circle>
          <circle class="ring-fill" id="ringFill" cx="14" cy="14" r="11.5" stroke-dasharray="72.3" stroke-dashoffset="72.3"></circle>
        </svg>
      </div>
      <span class="progress-count" id="progressCount">0/4</span>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="hint">Auto-plays on a loop</div>
</div>

<script>
const TASKS = [
  {id:'TSK-142', title:'Set up OAuth provider config', prio:'high', init:'AR'},
  {id:'TSK-138', title:'Write onboarding empty-state copy', prio:'low', init:'JM'},
  {id:'TSK-151', title:'Audit color contrast on dark mode', prio:'med', init:'KP'},
  {id:'TSK-133', title:'Pomodoro timer chime + haptics', prio:'med', init:'DL'},
];
const prioLabel = {high:'High', med:'Med', low:'Low'};

const listEl = document.getElementById('list');
const ringFill = document.getElementById('ringFill');
const progressCount = document.getElementById('progressCount');
const RING_CIRC = 72.3;

let doneState = {};

function render(){
  listEl.innerHTML = TASKS.map(t => `
    <div class="task ${doneState[t.id] ? 'done' : ''}" data-id="${t.id}">
      <div class="checkbox">
        <span class="ripple"></span>
        <svg viewBox="0 0 24 24"><path class="tick" d="M5 13l4 4L15 7"/></svg>
      </div>
      <div class="task-body">
        <div class="task-title">${t.title}<span class="strike"></span></div>
        <div class="task-meta">
          <span class="badge ${t.prio}">${prioLabel[t.prio]}</span>
          <span class="avatar mono">${t.init}</span>
        </div>
      </div>
    </div>
  `).join('');

  updateProgress();
}

function updateProgress(){
  const total = TASKS.length;
  const done = Object.values(doneState).filter(Boolean).length;
  progressCount.textContent = `${done}/${total}`;
  const offset = RING_CIRC - (RING_CIRC * (done/total));
  ringFill.style.strokeDashoffset = offset;
}

function toggle(id){
  doneState[id] = !doneState[id];
  const el = listEl.querySelector(`.task[data-id="${id}"]`);
  if(el){
    el.classList.toggle('done', doneState[id]);
    if(doneState[id]){
      const ripple = el.querySelector('.ripple');
      ripple.style.animation = 'none';
      void ripple.offsetWidth;
      ripple.style.animation = '';
      const tick = el.querySelector('.tick');
      tick.style.animation = 'none';
      void tick.offsetWidth;
      tick.style.animation = '';
    }
  }
  updateProgress();
}

render();

// ---- Simulated cursor helpers ----
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function createFakeCursor(){
  const c = document.createElement('div');
  c.className = 'fake-cursor';
  c.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 3 L4 19 L8.3 15.2 L11 21 L13.6 19.9 L11 14.2 L17 14.2 Z" fill="#1a1d27" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  document.body.appendChild(c);
  return c;
}
const fakeCursor = createFakeCursor();
const TIP_X = 3.4, TIP_Y = 2.6;

function cursorTo(x,y){
  fakeCursor.style.left = (x-TIP_X) + 'px';
  fakeCursor.style.top = (y-TIP_Y) + 'px';
}
async function moveCursor(x,y){
  if(!fakeCursor.classList.contains('visible')){
    cursorTo(x,y);
    fakeCursor.classList.add('visible');
    await sleep(60);
    return;
  }
  cursorTo(x,y);
  await sleep(460);
}
function spawnRipple(x,y){
  const r = document.createElement('div');
  r.className = 'cursor-ripple';
  r.style.left = x+'px';
  r.style.top = y+'px';
  document.body.appendChild(r);
  setTimeout(()=> r.remove(), 600);
}
async function clickCursor(x,y){
  await moveCursor(x,y);
  fakeCursor.classList.add('pressed');
  spawnRipple(x,y);
  await sleep(150);
  fakeCursor.classList.remove('pressed');
  await sleep(120);
}
function hideCursorEl(){ fakeCursor.classList.remove('visible'); }

// ---- Auto-play loop ----
let autoRunning = false;
async function autoLoop(){
  if(autoRunning) return;
  autoRunning = true;
  doneState = {};
  render();
  await sleep(900);

  for(const t of TASKS){
    const checkboxEl = listEl.querySelector(`.task[data-id="${t.id}"] .checkbox`);
    const rect = checkboxEl.getBoundingClientRect();
    await clickCursor(rect.left + rect.width/2, rect.top + rect.height/2);
    toggle(t.id);
    await sleep(420);
  }

  await sleep(1400);
  hideCursorEl();
  await sleep(600);
  autoRunning = false;
  autoLoop();
}
autoLoop();
</script>
</body>
</html>
